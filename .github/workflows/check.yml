name: check

# Public repository: runs on every pull request and on main.
on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # tool-versions.json is the one place these numbers live; the start page reads it too.
      - name: Read the pinned tool versions
        id: pins
        run: |
          echo "typstgen=$(jq -r .typstgen tool-versions.json)" >> "$GITHUB_OUTPUT"
          echo "chartlet=$(jq -r .chartlet tool-versions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/typstgen
            ~/.cargo/bin/chartlet
          key: typstgen-${{ steps.pins.outputs.typstgen }}-chartlet-${{ steps.pins.outputs.chartlet }}
      - name: Install typstgen and chartlet
        run: |
          command -v typstgen || cargo install typstgen --version "${{ steps.pins.outputs.typstgen }}" --locked
          command -v chartlet || cargo install chartlet --version "${{ steps.pins.outputs.chartlet }}" --locked
      - name: Install schema and PDF inspection tools
        run: >-
          python3 -m pip install
          "jsonschema==$(jq -r .python_packages.jsonschema tool-versions.json)"
          "referencing==$(jq -r .python_packages.referencing tool-versions.json)"
          "pypdf==$(jq -r .python_packages.pypdf tool-versions.json)"
      - name: Compile examples and diagrams, ZUGFeRD invoices, schemas, locales
        run: scripts/check.sh

  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read the coordinated typstgen revision
        id: profiles
        run: echo "revision=$(jq -r .typstgen_profiles_revision tool-versions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.local/typstgen-profiles/bin/typstgen
          key: typstgen-profiles-${{ steps.profiles.outputs.revision }}
      - name: Build the coordinated profile tooling
        run: |
          if [ ! -x "$HOME/.local/typstgen-profiles/bin/typstgen" ]; then
            cargo install typstgen --debug --locked --git https://github.com/casoon/typstgen \
              --rev "${{ steps.profiles.outputs.revision }}" --root "$HOME/.local/typstgen-profiles"
          fi
      - name: Install PDF inspection tools
        run: python3 -m pip install "pypdf==$(jq -r .python_packages.pypdf tool-versions.json)"
      - name: Check profiles and canonical PDF/XML values
        run: python3 scripts/check-profiles.py --typstgen "$HOME/.local/typstgen-profiles/bin/typstgen"
