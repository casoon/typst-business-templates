name: check

# Public repository: runs on every pull request and on main.
on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/typstgen
            ~/.cargo/bin/chartlet
          key: typstgen-0.5.0-chartlet-0.19.0
      - name: Install typstgen and chartlet
        run: |
          command -v typstgen || cargo install typstgen --version 0.5.0 --locked
          command -v chartlet || cargo install chartlet --version 0.19.0 --locked
      - name: Install jsonschema
        run: python3 -m pip install --upgrade jsonschema referencing
      - name: Compile examples and diagrams, ZUGFeRD invoices, schemas, locales
        run: scripts/check.sh
