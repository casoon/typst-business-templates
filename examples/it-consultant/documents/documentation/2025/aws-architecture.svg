<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="300" viewBox="0 0 1360 300" id="chartlet-0901fb1de5c04780-p" role="img" aria-labelledby="chartlet-0901fb1de5c04780-p-title chartlet-0901fb1de5c04780-p-description" class="chartlet-root"><title id="chartlet-0901fb1de5c04780-p-title">AWS-Architektur MedTech Solutions</title><desc id="chartlet-0901fb1de5c04780-p-description">Architecture diagram with 8 components and 8 connections in 4 boundaries. VPC 10.0.0.0/16: Public Subnets, Private Subnets. Public Subnets (in VPC 10.0.0.0/16): Load Balancer. Private Subnets (in VPC 10.0.0.0/16): RDS PostgreSQL, ECS Cluster (Fargate). ECS Cluster (Fargate) (in Private Subnets): API Gateway, Patient Service, Billing Service. Main path: Nutzer → Route 53 → CloudFront → Load Balancer → API Gateway → Patient Service → RDS PostgreSQL. Nutzer (person): connects to Route 53 (löst auf). Route 53 (external system): connects to CloudFront. CloudFront (security): connects to Load Balancer (via HTTPS). Load Balancer (service): connects to API Gateway. API Gateway (service): connects to Patient Service and Billing Service. Patient Service (service): connects to RDS PostgreSQL (via SQL). Billing Service (service): connects to RDS PostgreSQL (via SQL). RDS PostgreSQL (database): no outgoing connection.</desc><style>#chartlet-0901fb1de5c04780-p.chartlet-root{max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#172033}#chartlet-0901fb1de5c04780-p .chartlet-title{font-size:22px;font-weight:600;fill:#172033}#chartlet-0901fb1de5c04780-p .chartlet-label,#chartlet-0901fb1de5c04780-p .chartlet-tick,#chartlet-0901fb1de5c04780-p .chartlet-value,#chartlet-0901fb1de5c04780-p .chartlet-value-inverse,#chartlet-0901fb1de5c04780-p .chartlet-axis-title{font-size:12px;fill:#344054}#chartlet-0901fb1de5c04780-p .chartlet-value,#chartlet-0901fb1de5c04780-p .chartlet-value-inverse{font-weight:600}#chartlet-0901fb1de5c04780-p .chartlet-value{fill:#172033}#chartlet-0901fb1de5