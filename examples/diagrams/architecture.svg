<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="450" viewBox="0 0 1160 450" id="chartlet-8e62de000d7a100e-p" role="img" aria-labelledby="chartlet-8e62de000d7a100e-p-title chartlet-8e62de000d7a100e-p-description" class="chartlet-root"><title id="chartlet-8e62de000d7a100e-p-title">Plattform-Architektur</title><desc id="chartlet-8e62de000d7a100e-p-description">Architecture diagram with 9 components and 11 connections in 2 boundaries. Backend: API Gateway, Auth Service, Project Service, Billing Service, Job Queue, Datenhaltung. Datenhaltung (in Backend): PostgreSQL, Object Storage. Web App (frontend): connects to API Gateway (via HTTPS). Mobile App (frontend): connects to API Gateway (via HTTPS). API Gateway (service): connects to Auth Service (via JWT), Project Service (via REST) and Billing Service (via REST). Auth Service (security): connects to PostgreSQL (Users). Billing Service (service): connects to PostgreSQL (Invoices). Project Service (service): connects to Job Queue (Events), PostgreSQL (Projects) and Object Storage (Files). PostgreSQL (database): no outgoing connection. Job Queue (queue): connects to Object Storage (Exports). Object Storage (storage): no outgoing connection.</desc><style>#chartlet-8e62de000d7a100e-p.chartlet-root{max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#172033}#chartlet-8e62de000d7a100e-p .chartlet-title{font-size:22px;font-weight:600;fill:#172033}#chartlet-8e62de000d7a100e-p .chartlet-label,#chartlet-8e62de000d7a100e-p .chartlet-tick,#chartlet-8e62de000d7a100e-p .chartlet-value,#chartlet-8e62de000d7a100e-p .chartlet-value-inverse,#chartlet-8e62de000d7a100e-p .chartlet-axis-title{font-size:12px;fill:#344054}#chartlet-8e62de000d7a100e-p .chartlet-value,#chartlet-8e62de000d7a100e-p .chartlet-value-inverse{font-weight:600}#chartlet-8e62de000d7a100e-p .chartlet-value{fill:#172033}#chartlet-8e62de000d7a100e-p .chartlet-value-inverse{fill:#fff}#chartlet-8e62de000d7a100e-p .chartlet-axis-ti